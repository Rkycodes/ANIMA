<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="710" viewBox="0 0 1330 710" role="img" aria-labelledby="title desc">
<title id="title">ANIMA bypass edge timing budget</title>
<desc id="desc">Ideal aligned RX and TX study, with final right sample capture at zero, left LRCK transition at 7.5 bit periods, and next left MSB launch at 8.5. The selected deadline includes eligible acceptance on the left LRCK scheduling edge. No timing closure is implied.</desc>
