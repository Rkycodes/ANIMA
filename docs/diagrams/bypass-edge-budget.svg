<line x1="230" y1="490" x2="1097.0" y2="490" stroke="#89dfb0" stroke-width="1.5"/>
<line x1="230" y1="485" x2="230" y2="495" stroke="#89dfb0" stroke-width="1.5"/>
<line x1="1097.0" y1="485" x2="1097.0" y2="495" stroke="#89dfb0" stroke-width="1.5"/>
<text x="663.5" y="480" class="small" text-anchor="middle">To left MSB launch: 8.5 T = 2.766897 us</text>
<text x="36" y="550" class="small" text-anchor="start">t = 0: R[n] LSB captured on rising SCLK; pair can then be assembled.</text>
<text x="36" y="576" class="small" text-anchor="start">* TX selects expected frame n at the next left boundary; acceptance on that edge counts. Otherwise send silence.</text>
<text x="36" y="602" class="small muted" text-anchor="start">T = 325.517 ns for the first-build target (nominal 100 MHz reference). One internal audio/DSP domain with enables; no frame CDC planned.</text>
<text x="36" y="630" class="small" text-anchor="start">98.305085 MHz first-build target: 32 cycles/T; 240 cycles to selection, 272 to MSB launch, 288 to DAC capture.</text>
<text x="36" y="658" class="small muted" text-anchor="start">Calculated target budgets only; oscillator tolerance not shown. Assembly, handoff, stale draining, TX preparation and margin consume available time.</text>
<text x="36" y="686" class="small muted" text-anchor="start">No achieved frequency, clock phase, timing closure or hardware validation is claimed.</text>
